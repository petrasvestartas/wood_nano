<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Translation shell: cross-section profile (left) swept along a path (bottom).
       Shows the two input curves + the resulting ruled surface. -->
  <!-- Profile curve (cross-section): arch on left side -->
  <path d="M 4,21 C 4,10 11,4 11,4"/>
  <!-- Path curve (sweep direction): horizontal base -->
  <line x1="4" y1="21" x2="21" y2="21"/>
  <!-- Three parallel ribs showing translation sweep -->
  <line x1="9"  y1="9"  x2="9"  y2="21"/>
  <line x1="14" y1="7"  x2="14" y2="21"/>
  <line x1="19" y1="6"  x2="19" y2="21"/>
  <!-- Top profile connecting the rib tips -->
  <path d="M 11,4 C 14,5 17,5.5 20,5.8"/>
</svg>
