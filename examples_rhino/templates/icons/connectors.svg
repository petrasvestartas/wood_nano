<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- VDA mesh: face plates connected by rectangular edge connectors.
       Shows a hexagonal face plate (centre) with connector tabs on each edge. -->
  <!-- Central hexagonal face plate -->
  <polygon points="12,4 18,8 18,16 12,20 6,16 6,8"/>
  <!-- Edge connectors (small rectangles on each face edge) -->
  <line x1="10" y1="2"  x2="14" y2="2"/>   <!-- top connector top -->
  <line x1="10" y1="2"  x2="10" y2="4"/>
  <line x1="14" y1="2"  x2="14" y2="4"/>
  <line x1="19" y1="6"  x2="22" y2="4"/>   <!-- upper-right -->
  <line x1="19" y1="10" x2="22" y2="12"/>  <!-- lower-right -->
  <line x1="10" y1="22" x2="14" y2="22"/>  <!-- bottom -->
  <line x1="10" y1="20" x2="10" y2="22"/>
  <line x1="14" y1="20" x2="14" y2="22"/>
  <line x1="5"  y1="10" x2="2"  y2="12"/>  <!-- lower-left -->
  <line x1="5"  y1="6"  x2="2"  y2="4"/>   <!-- upper-left -->
</svg>
