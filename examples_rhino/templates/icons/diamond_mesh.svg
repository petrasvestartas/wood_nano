<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Diamond mesh: 3×2 grid of rhombus tiles with one diagonal each
       (like the triangulated diamond mesh in the template). -->
  <!-- Outer boundary -->
  <polygon points="12,2 22,8 22,16 12,22 2,16 2,8"/>
  <!-- Interior horizontal axis -->
  <line x1="2"  y1="12" x2="22" y2="12"/>
  <!-- Interior vertical axes -->
  <line x1="7"  y1="5"  x2="7"  y2="19"/>
  <line x1="12" y1="2"  x2="12" y2="22"/>
  <line x1="17" y1="5"  x2="17" y2="19"/>
  <!-- Diagonals inside each diamond (the triangulation cut) -->
  <line x1="2"  y1="8"  x2="7"  y2="12"/>
  <line x1="7"  y1="5"  x2="12" y2="8"/>
  <line x1="12" y1="8"  x2="17" y2="12"/>
  <line x1="17" y1="5"  x2="22" y2="8"/>
  <line x1="2"  y1="16" x2="7"  y2="12"/>
  <line x1="7"  y1="19" x2="12" y2="16"/>
  <line x1="12" y1="16" x2="17" y2="12"/>
  <line x1="17" y1="19" x2="22" y2="16"/>
</svg>
