<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Translation nexorade: 2 horizontal + 2 vertical beams, each SLID PAST
       the other (not meeting at a node). The offset crossings are the key
       visual — beams never share an endpoint. -->
  <!-- Horizontal beam 1: runs left half, shifted to upper row -->
  <line x1="2"  y1="9"  x2="15" y2="9"/>
  <!-- Horizontal beam 2: runs right half, shifted to lower row -->
  <line x1="9"  y1="15" x2="22" y2="15"/>
  <!-- Vertical beam 1: runs upper half, shifted to left column -->
  <line x1="9"  y1="2"  x2="9"  y2="15"/>
  <!-- Vertical beam 2: runs lower half, shifted to right column -->
  <line x1="15" y1="9"  x2="15" y2="22"/>
</svg>
