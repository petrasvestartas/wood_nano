[build-system]
requires = ["scikit-build-core >=0.10", "nanobind >=1.3.2"]
build-backend = "scikit_build_core.build"

[project]
name = "wood_nano"
description = "Python bindings for the wood timber joinery C++ library."
requires-python = ">=3.9"
dependencies = ["numpy>=1.21.0", "session_py", "session-rhino"]
authors = [{ name = "Petras Vestartas", email = "petrasvestartas@gmail.com" }]
dynamic = ["version"]

[project.optional-dependencies]
dev = ["scikit-build-core>=0.10", "nanobind>=1.3.2", "pytest>=7.0", "numpy>=1.21.0"]

# ── uv environment ────────────────────────────────────────────────────────────
# Setup (run once):
#   uv venv
#   uv pip install nanobind scikit-build-core numpy pytest
#   uv pip install --no-build-isolation -e .
#
# Rebuild after C++ changes:
#   uv pip install --no-build-isolation -e .
#
# Run examples:
#   uv run python examples/templates/translation_shell.py
#
# Note: --no-build-isolation is required so scikit-build-core reuses the
# already-installed nanobind/cmake instead of fetching them in isolation.
[dependency-groups]
dev = [
    "nanobind>=1.3.2",
    "scikit-build-core>=0.10",
    "numpy>=1.21.0",
    "pytest>=7.0",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
# No abi3: nanobind only emits stable-ABI binaries on CPython >= 3.12
# (nanobind-config.cmake sets STABLE_ABI FALSE below that and says so).
# Declaring py-api = "cp39" while building on 3.9 therefore produced a wheel
# TAGGED cp39-abi3 whose binaries link python39.dll - it installs on 3.10+
# and then fails to import with a DLL load error. Version-specific wheels
# per interpreter are correct for every version we ship.
cmake.version = ">=3.15"
cmake.build-type = "Release"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "src/wood_nano/__init__.py"

[tool.scikit-build.cmake.define]
CMAKE_POLICY_DEFAULT_CMP0135 = "NEW"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

# ── cibuildwheel ─────────────────────────────────────────────────────────────
[tool.cibuildwheel]
build-verbosity = 1
build = ["cp39-*", "cp310-*", "cp311-*", "cp312-*", "cp313-*"]
# Skip 32-bit targets (i686 GCC doesn't support C++23) and musl Linux
skip = ["*-win32", "*-musllinux*", "*-manylinux_i686"]

[tool.cibuildwheel.linux]
# manylinux2014 ships gcc 10 (no C++23); manylinux_2_28 ships gcc 12+
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
before-build = "pip install ninja"

[tool.cibuildwheel.macos]
before-build = "pip install ninja"
# archs set per-runner in wheels.yml: macos-13=x86_64, macos-latest=arm64

[tool.cibuildwheel.windows]
before-build = "pip install ninja"
