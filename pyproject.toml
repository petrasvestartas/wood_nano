[build-system]
requires = ["scikit-build-core >=0.10", "nanobind >=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "wood_nano"
description = "Python bindings for the wood timber joinery C++ library."
requires-python = ">=3.12"
dependencies = ["numpy>=1.21.0", "session_py", "session-rhino"]
authors = [{ name = "Petras Vestartas", email = "petrasvestartas@gmail.com" }]
dynamic = ["version"]

[project.optional-dependencies]
dev = ["scikit-build-core>=0.10", "nanobind>=3.0", "pytest>=7.0", "numpy>=1.21.0"]

# ── uv environment ────────────────────────────────────────────────────────────
# Setup (run once):
#   uv venv
#   uv pip install nanobind scikit-build-core numpy pytest
#   uv pip install --no-build-isolation -e .
#
# Rebuild after C++ changes:
#   uv pip install --no-build-isolation -e .
#
# Run examples:
#   uv run python examples/templates/translation_shell.py
#
# Note: --no-build-isolation is required so scikit-build-core reuses the
# already-installed nanobind/cmake instead of fetching them in isolation.
[dependency-groups]
dev = [
    "nanobind>=3.0",
    "scikit-build-core>=0.10",
    "numpy>=1.21.0",
    "pytest>=7.0",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
# ONE abi3 wheel per platform, covering CPython 3.12 and every later version.
#
# nanobind emits genuinely stable-ABI binaries only on CPython >= 3.12:
# nanobind-config.cmake sets STABLE_ABI FALSE below that and says so. The old
# `py-api = "cp39"` built on 3.9 therefore produced a wheel TAGGED cp39-abi3
# whose binaries link python39.dll - it installed on 3.10+ and then failed to
# import with a DLL load error. Building ON 3.12 makes the abi3 promise real.
#
# 3.12 is also the floor nanobind 3.x requires, and it covers Rhino 9's
# Python 3.13.3 runtime plus whatever Rhino ships next, with no new wheel.
# Rhino 8 (Python 3.9) is deliberately not supported: 3.9 went end-of-life at
# the end of 2025 and nanobind 3.0 dropped it.
wheel.py-api = "cp312"
# The COMPAS adapter lives in the separate compas_wood repo; only wood_nano
# ships in the wheel.
wheel.packages = ["src/wood_nano"]
cmake.version = ">=3.15"
cmake.build-type = "Release"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "src/wood_nano/__init__.py"

[tool.scikit-build.cmake.define]
CMAKE_POLICY_DEFAULT_CMP0135 = "NEW"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

# ── cibuildwheel ─────────────────────────────────────────────────────────────
[tool.cibuildwheel]
build-verbosity = 1
# One build per platform. py-api = "cp312" makes it an abi3 wheel that
# installs on 3.12, 3.13, 3.14 and later - no per-version wheels needed.
build = ["cp312-*"]
# Skip 32-bit targets (i686 GCC doesn't support C++23) and musl Linux
skip = ["*-win32", "*-musllinux*", "*-manylinux_i686"]

[tool.cibuildwheel.linux]
# manylinux2014 ships gcc 10 (no C++23); manylinux_2_28 ships gcc 12+
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
before-build = "pip install ninja"

[tool.cibuildwheel.macos]
before-build = "pip install ninja"
# archs set per-runner in wheels.yml: macos-13=x86_64, macos-latest=arm64

[tool.cibuildwheel.windows]
before-build = "pip install ninja"
