name: Build wheels

on:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build_wheels:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Allow individual matrix jobs to fail without blocking publish
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-latest      # arm64 runner (Apple Silicon M1, macOS 15)
            cibw_archs: arm64
          - os: macos-15-intel    # x86_64 runner (Intel, macOS 15) — replaces stale macos-13
            cibw_archs: x86_64
            macos_target: "10.15"  # absl requires 10.13+; 10.15 is safe minimum

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install cibuildwheel
        run: pip install cibuildwheel

      - name: Build wheels
        env:
          CIBW_ARCHS_MACOS: ${{ matrix.cibw_archs }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}
        run: python -m cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: wheelhouse/*.whl

  publish:
    name: Publish to PyPI
    needs: build_wheels
    runs-on: ubuntu-latest
    # Publish even if some matrix jobs failed/timed-out, as long as we have
    # at least the ubuntu and windows wheels (macos-13 can be slow).
    if: |
      startsWith(github.ref, 'refs/tags/v') &&
      !cancelled()
    environment:
      name: pypi
      url: https://pypi.org/project/wood_nano/
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-wheels-*
          merge-multiple: true
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
