name: Build wheels

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger. GitHub stops auto-scheduling workflows in a repository that
  # has been idle for ~60 days: the workflow still reports `active` and a push
  # still dispatches other workflows, but this one is never queued. Without a
  # dispatch trigger there is then no way to build or release at all.
  workflow_dispatch:

jobs:
  bump_version:
    name: Bump patch version
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump patch version
        id: bump
        run: |
          python3 - <<'EOF'
          import re, pathlib, os
          f = pathlib.Path("src/wood_nano/__init__.py")
          content = f.read_text()
          m = re.search(r'__version__ = "(\d+)\.(\d+)\.(\d+)"', content)
          major, minor, patch = m.groups()
          new_version = f"{major}.{minor}.{int(patch)+1}"
          f.write_text(content[:m.start()] + f'__version__ = "{new_version}"' + content[m.end():])
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"new_version={new_version}\n")
          print(f"Bumped to {new_version}")
          EOF

      - name: Commit bumped version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/wood_nano/__init__.py
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          git push

  build_wheels:
    name: ${{ matrix.os }}
    needs: [bump_version]
    if: always() && (needs.bump_version.result == 'success' || needs.bump_version.result == 'skipped')
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-latest      # arm64 runner (Apple Silicon M1, macOS 15)
            cibw_archs: arm64
            macos_target: "11.0"
          - os: macos-15-intel    # x86_64 runner (Intel, macOS 15)
            cibw_archs: x86_64
            macos_target: "10.15"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # pick up the bumped-version commit

      - uses: actions/setup-python@v5
        with:
          # Host interpreter for cibuildwheel, not a build target. On 3.9 pip
          # resolves cibuildwheel 2.23.4 (the last release supporting 3.9),
          # which pins manylinux image tag 2025.04.19-1 - deleted from quay.io,
          # so every Linux build died with "No such image".
          python-version: "3.13"

      - name: Install cibuildwheel
        run: pip install cibuildwheel

      - name: Build wheels
        env:
          CIBW_ARCHS_MACOS: ${{ matrix.cibw_archs }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}
        run: python -m cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: wheelhouse/*.whl

  publish:
    name: Publish to PyPI
    needs: build_wheels
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && !cancelled()
    environment:
      name: pypi
      url: https://pypi.org/project/wood_nano/
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-wheels-*
          merge-multiple: true
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
